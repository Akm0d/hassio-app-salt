---
name: Salt
version: "0.14.37"
slug: salt
description: Run a fully managed Salt master with a UI to manage minions, SLS files, states, and more.
url: https://github.com/Akm0d/hassio-app-salt
startup: services
boot: auto
init: false
protected: false
docker_api: true
ingress: true
ingress_port: 8099
ingress_entry: /
panel_icon: mdi:shaker-outline
panel_title: Salt
panel_admin: true
arch:
  - aarch64
  - amd64
map:
  - type: share
    read_only: false
    path: /srv
  - type: homeassistant_config
    read_only: false
    path: /config
ports:
  4505/tcp: 4505
  4506/tcp: 4506
ports_description:
  4505/tcp: Salt publish port
  4506/tcp: Salt return port
options:
  materium:
    host: 0.0.0.0
    cache_db: /data/materium/cache.sqlite
    formula_repositories:
      - name: Official
        url: https://github.com/saltstack-formulas
        plugin: github
      - name: Community
        url: https://github.com/salt-formulas
        plugin: github
      - name: Openstack
        url: https://github.com/openstack-archive
        plugin: github
  master:
    log_level: info
    auto_accept: false
    worker_threads: 50
schema:
  materium:
    host: str
    cache_db: str
    formula_repositories:
      - name: str
        url: str
        plugin: str
  master:
    log_level: list(trace|debug|info|notice|warning|error|fatal)
    auto_accept: bool
    worker_threads: int
